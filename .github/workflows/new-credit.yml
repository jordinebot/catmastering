name: Prepare credit pull request
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: credit-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'new-credit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate submission, add images and open a pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          CREDIT_AUTHORIZED_USERS: ${{ vars.CREDIT_AUTHORIZED_USERS }}
        run: node scripts/process-credit-issue.mjs
